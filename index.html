<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Trip Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb, #4facfe, #00f2fe);
            background-size: 300% 300%;
            animation: bg 15s ease infinite;
        }

        @keyframes bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 90%;
            max-width: 1000px;
            padding: 40px;
            background: rgba(10, 20, 30, 0.4);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            font-size: 64px;
            margin: 20px 0;
            color: #ffb82e;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            text-align: center;
            font-size: 18px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .trip-date {
            text-align: center;
            font-size: 24px;
            color: #ffb82e;
            margin-bottom: 10px;
        }

        .date-value {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .countdown-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .countdown-number {
            font-size: 48px;
            font-weight: bold;
            line-height: 1;
            margin-bottom: 10px;
        }

        .countdown-label {
            font-size: 12px;
            color: #ffb82e;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .today-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            margin: 20px auto;
            width: fit-content;
        }

        .today-box strong {
            color: #ffb82e;
        }

        .message {
            text-align: center;
            font-size: 24px;
            font-style: italic;
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            opacity: 0.7;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 40px;
            }
            
            .countdown {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }
            
            .countdown-number {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="trip-date">TRACK YOUR</div>
        <h1>FUN TRIP</h1>
        <div class="subtitle">ADVENTURE AWAITS · MEMORIES FOREVER</div>

        <div class="trip-date">TRIP STARTS ON</div>
        <div class="date-value">29 SEPTEMBER</div>

        <div class="countdown">
            <div class="countdown-item">
                <div class="countdown-number" id="days">00</div>
                <div class="countdown-label">DAYS</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="hours">00</div>
                <div class="countdown-label">HOURS</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="minutes">00</div>
                <div class="countdown-label">MINUTES</div>
            </div>
            <div class="countdown-item">
                <div class="countdown-number" id="seconds">00</div>
                <div class="countdown-label">SECONDS</div>
            </div>
        </div>

        <div class="today-box">
            TODAY IS <strong id="today">17 AUGUST 2026</strong>
        </div>

        <div class="message">Let the adventure begin!</div>

        <div class="footer">
            EXPLORE · CAPTURE · EXPERIENCE · DISCOVER · ENJOY
        </div>
    </div>

    <script>
        const tripDate = new Date("2026-09-29").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const diff = tripDate - now;

            if (diff < 0) {
                document.querySelector(".date-value").textContent = "THE ADVENTURE HAS BEGUN!";
                document.getElementById("days").textContent = "∞";
                document.getElementById("hours").textContent = "∞";
                document.getElementById("minutes").textContent = "∞";
                document.getElementById("seconds").textContent = "∞";
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, "0");
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }

        const today = new Date();
        const options = { day: "2-digit", month: "long", year: "numeric" };
        document.getElementById("today").textContent = today.toLocaleDateString("en-US", options).toUpperCase();

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
