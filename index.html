<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Trip Countdown</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to right, #667eea, #764ba2, #f093fb, #4facfe, #00f2fe, #667eea);
            background-size: 200% 200%;
            animation: gradient 15s ease infinite;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            width: min(1200px, 94vw);
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 28px;
            background: rgba(4, 12, 21, 0.5);
            backdrop-filter: blur(10px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .kicker {
            text-align: center;
            font-size: 16px;
            letter-spacing: 0.35em;
            margin-bottom: 10px;
        }

        .title {
            text-align: center;
            font-size: 72px;
            font-weight: 900;
            color: #ffb82e;
            text-shadow: 0 5px 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            font-size: 18px;
            letter-spacing: 0.16em;
            margin-bottom: 40px;
        }

        .start {
            text-align: center;
            color: #ffb82e;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 0.18em;
            margin-bottom: 10px;
        }

        .date {
            text-align: center;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .box {
            text-align: center;
            padding: 25px 15px;
            background: rgba(5, 12, 19, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 17px;
        }

        .num {
            font-size: 56px;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 10px;
        }

        .label {
            color: #ffb82e;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.15em;
        }

        .today {
            text-align: center;
            display: inline-block;
            margin: 20px auto;
            padding: 12px 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.35);
            font-size: 14px;
            letter-spacing: 0.08em;
        }

        .today b {
            color: #ffb82e;
        }

        .today-wrapper {
            text-align: center;
            margin: 20px 0;
        }

        .message {
            text-align: center;
            font-size: 26px;
            font-style: italic;
            margin: 20px 0;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            letter-spacing: 0.18em;
            opacity: 0.85;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            .card {
                padding: 20px;
            }

            .title {
                font-size: 48px;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .num {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="kicker">TRACK YOUR</div>
        <div class="title">FUN TRIP</div>
        <div class="subtitle">ADVENTURE AWAITS · MEMORIES FOREVER</div>

        <div class="start">TRIP STARTS ON</div>
        <div class="date">29 SEPTEMBER</div>

        <section class="grid">
            <div class="box">
                <div class="num" id="days">00</div>
                <div class="label">DAYS</div>
            </div>
            <div class="box">
                <div class="num" id="hours">00</div>
                <div class="label">HOURS</div>
            </div>
            <div class="box">
                <div class="num" id="minutes">00</div>
                <div class="label">MINUTES</div>
            </div>
            <div class="box">
                <div class="num" id="seconds">00</div>
                <div class="label">SECONDS</div>
            </div>
        </section>

        <div class="today-wrapper">
            <div class="today">
                TODAY IS <b id="today">17 AUGUST 2026</b>
            </div>
        </div>

        <div class="message">Let the adventure begin!</div>

        <div class="footer">
            EXPLORE · CAPTURE · EXPERIENCE · DISCOVER · ENJOY
        </div>
    </main>

    <script>
        const tripDate = new Date("2026-09-29T00:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const timeLeft = tripDate - now;

            if (timeLeft < 0) {
                document.querySelector(".date").textContent = "THE ADVENTURE HAS BEGUN!";
                document.getElementById("days").textContent = "∞";
                document.getElementById("hours").textContent = "∞";
                document.getElementById("minutes").textContent = "∞";
                document.getElementById("seconds").textContent = "∞";
                return;
            }

            const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, "0");
            document.getElementById("hours").textContent = String(hours).padStart(2, "0");
            document.getElementById("minutes").textContent = String(minutes).padStart(2, "0");
            document.getElementById("seconds").textContent = String(seconds).padStart(2, "0");
        }

        const todayDate = new Date();
        const dateString = todayDate.toLocaleDateString("en-US", { day: "2-digit", month: "long", year: "numeric" }).toUpperCase();
        document.getElementById("today").textContent = dateString;

        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
